name: CI

# TECH-09 : à chaque push, sur toutes les branches.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # TEST-02 : tests de bout en bout (Playwright) sur le build de production,
  # avec une vraie base PostgreSQL. Connexion par mot de passe (TEST-03).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fastclap
          POSTGRES_PASSWORD: fastclap
          POSTGRES_DB: fastclap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fastclap:fastclap@localhost:5432/fastclap?schema=public
      # Secret jetable, différent à chaque exécution : rien de réel n'est commité.
      AUTH_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
