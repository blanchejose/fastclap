# Garde le site éveillé : l'offre gratuite de Render endort le service après
# 15 minutes sans visite (le premier visiteur attendrait alors ~1 minute).
# Une visite toutes les 10 minutes suffit, et reste dans les 750 h gratuites
# par mois de Render (un seul service allumé en continu = 744 h au maximum).
name: Garder le site éveillé

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visiter /api/health
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 https://fastclap.onrender.com/api/health
