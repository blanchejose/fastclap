# Blueprint Render : https://render.com/docs/blueprint-spec
# Crée le site web (HTTPS automatique). La base PostgreSQL est chez Neon.
services:
  - type: web
    name: fastclap
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Adresse de la base Neon, à saisir dans le tableau de bord Render.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Clés OAuth à saisir dans le tableau de bord Render (jamais dans Git).
      - key: AUTH_DISCORD_ID
        sync: false
      - key: AUTH_DISCORD_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
