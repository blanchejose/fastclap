# Blueprint Render : https://render.com/docs/blueprint-spec
# Crée le site web (HTTPS automatique) et la base PostgreSQL en une fois.
services:
  - type: web
    name: fastclap
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fastclap-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Clés OAuth à saisir dans le tableau de bord Render (jamais dans Git).
      - key: AUTH_DISCORD_ID
        sync: false
      - key: AUTH_DISCORD_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false

databases:
  - name: fastclap-db
    plan: free
    region: ohio
    databaseName: fastclap
    user: fastclap
