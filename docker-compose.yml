# Base PostgreSQL locale pour le développement : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastclap
      POSTGRES_PASSWORD: fastclap
      POSTGRES_DB: fastclap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
